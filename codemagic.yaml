# Manual workflows: validation, Android device testing, and iOS TestFlight.
workflows:
  godot-validate:
    name: Ishaq's Fishing Trip - validate
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      vars:
        GODOT_VERSION: 4.5.1
    scripts:
      - name: Install pinned Godot editor
        script: |
          set -eu
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/ishaq-godot
      - name: Import and check project
        script: |
          set -eu
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --editor --import --quit
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --quit-after 120
      - name: Check fishing and market transactions
        script: |
          set -eu
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --script res://tests/trip_smoke.gd
      - name: Check helm physics and touch ownership
        script: |
          set -eu
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --script res://tests/helm_checks.gd
      - name: Check gear purchases and loadouts
        script: |
          set -eu
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --script res://tests/gear_checks.gd
      - name: Check expanded ocean systems
        script: |
          set -eu
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --script res://tests/ocean_checks.gd

      - name: Check species-specific fish models
        script: |
          set -eu
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --script res://tests/fish_checks.gd
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --script res://tests/species_market_checks.gd
          /tmp/ishaq-godot/Godot.app/Contents/MacOS/Godot --headless --path "$CM_BUILD_DIR" --script res://tests/boat_model_checks.gd

  android-test:
    name: Ishaq's Fishing Trip - Android test APK
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      java: 17
      vars:
        GODOT_VERSION: 4.5.1
    scripts:
      - name: Install Godot and Android export template
        script: |
          set -eu
          mkdir -p /tmp/ishaq-android-godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o /tmp/ishaq-editor.zip
          unzip -q /tmp/ishaq-editor.zip -d /tmp/ishaq-android-godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/ishaq-templates.zip
          bash "$CM_BUILD_DIR/tools/ci-android.sh" setup
      - name: Import and run game checks
        script: |
          set -eu
          GODOT=/tmp/ishaq-android-godot/Godot.app/Contents/MacOS/Godot
          "$GODOT" --headless --path "$CM_BUILD_DIR" --script res://tools/check-mobile-config.gd
          "$GODOT" --headless --path "$CM_BUILD_DIR" --editor --import --quit
          for suite in trip_smoke helm_checks gear_checks ocean_checks fish_checks species_market_checks boat_model_checks; do
            "$GODOT" --headless --path "$CM_BUILD_DIR" --script "res://tests/${suite}.gd"
          done
      - name: Export installable Android APK
        script: |
          set -eu
          mkdir -p "$CM_BUILD_DIR/build/android"
          /tmp/ishaq-android-godot/Godot.app/Contents/MacOS/Godot --headless --verbose --path "$CM_BUILD_DIR" --export-debug "Android Test" "$CM_BUILD_DIR/build/android/ishaqs-fishing-trip.apk"
          test -s "$CM_BUILD_DIR/build/android/ishaqs-fishing-trip.apk"
    artifacts:
      - build/android/*.apk

  ios-testflight:
    name: Ishaq's Fishing Trip - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Match the API key name in Codemagic Team integrations.
      app_store_connect: codemagic
    environment:
      xcode: latest
      groups:
        - ios_testflight
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ishaqfishingtrip.appname
      vars:
        GODOT_VERSION: 4.5.1
        BUNDLE_ID: com.ishaqfishingtrip.appname
    scripts:
      - name: Check Apple settings and install pinned Godot
        script: |
          set -eu
          : "${APPLE_TEAM_ID:?Add APPLE_TEAM_ID to the ios_testflight variable group}"
          mkdir -p /tmp/ishaq-ios-godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o /tmp/ishaq-ios-editor.zip
          unzip -q /tmp/ishaq-ios-editor.zip -d /tmp/ishaq-ios-godot
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/ishaq-ios-templates.zip
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          unzip -p /tmp/ishaq-ios-templates.zip templates/ios.zip > "$TEMPLATE_DIR/ios.zip"
          test -s "$TEMPLATE_DIR/ios.zip"
      - name: Configure iPhone export and run checks
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          GODOT=/tmp/ishaq-ios-godot/Godot.app/Contents/MacOS/Godot
          export IOS_BUILD_NUMBER="${IOS_BUILD_NUMBER:-$((PROJECT_BUILD_NUMBER + 1))}"
          "$GODOT" --headless --path "$CM_BUILD_DIR" --script res://tools/prepare-ios.gd
          "$GODOT" --headless --path "$CM_BUILD_DIR" --editor --import --quit
          for suite in trip_smoke helm_checks gear_checks ocean_checks fish_checks species_market_checks boat_model_checks; do
            "$GODOT" --headless --path "$CM_BUILD_DIR" --script "res://tests/${suite}.gd"
          done
      - name: Export Xcode project
        script: |
          set -eu
          mkdir -p "$CM_BUILD_DIR/build/ios"
          /tmp/ishaq-ios-godot/Godot.app/Contents/MacOS/Godot --headless --verbose --path "$CM_BUILD_DIR" --export-release "iOS TestFlight" "$CM_BUILD_DIR/build/ios/IshaqsFishingTrip.ipa"
          test -d "$CM_BUILD_DIR/build/ios/IshaqsFishingTrip.xcodeproj"
      - name: Apply App Store signing and build IPA
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles --project "$CM_BUILD_DIR/build/ios/IshaqsFishingTrip.xcodeproj"
          xcode-project build-ipa --project "$CM_BUILD_DIR/build/ios/IshaqsFishingTrip.xcodeproj" --scheme IshaqsFishingTrip --config Release --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
          test -n "$(find "$CM_BUILD_DIR/build/ios/ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal testing; choose testers in App Store Connect.
        submit_to_testflight: false
        submit_to_app_store: false
